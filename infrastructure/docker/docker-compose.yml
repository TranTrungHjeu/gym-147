services:
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - PORT=80
      - IDENTITY_SERVICE_HOST=identity
      - IDENTITY_SERVICE_PORT=3001
      - MEMBER_SERVICE_HOST=member
      - MEMBER_SERVICE_PORT=3002
      - SCHEDULE_SERVICE_HOST=schedule
      - SCHEDULE_SERVICE_PORT=3003
      - BILLING_SERVICE_HOST=billing
      - BILLING_SERVICE_PORT=3004
      - DOCKER_ENV=true
    volumes:
      - ../../apps/web-admin/dist:/usr/share/nginx/html:ro
    ports: ["8080:80"]
    depends_on:
      identity:
        condition: service_started
      member:
        condition: service_started
      schedule:
        condition: service_started
      billing:
        condition: service_started
    restart: unless-stopped
  identity:
    build:
      context: ../../
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-service
    env_file: ../../services/identity-service/.env
    environment:
      - DOCKER_ENV=true
      - MEMBER_SERVICE_URL=http://member:3002
      - SCHEDULE_SERVICE_URL=http://schedule:3003
    ports: ["3001:3001"]
    volumes:
      - ../../packages:/packages:ro
    restart: unless-stopped
  member:
    build:
      context: ../../
      dockerfile: services/member-service/Dockerfile
    container_name: member-service
    env_file: ../../services/member-service/.env
    environment:
      - DOCKER_ENV=true
      - IDENTITY_SERVICE_URL=http://identity:3001
    ports: ["3002:3002"]
    volumes:
      - ../../packages:/packages:ro
    restart: unless-stopped
  schedule:
    build:
      context: ../../
      dockerfile: services/schedule-service/Dockerfile
    container_name: schedule-service
    env_file: ../../services/schedule-service/.env
    environment:
      - DOCKER_ENV=true
      - BILLING_SERVICE_URL=http://billing:3004
    ports: ["3003:3003"]
    depends_on:
      billing:
        condition: service_started
    volumes:
      - ../../packages:/packages:ro
    restart: unless-stopped
  billing:
    build:
      context: ../../
      dockerfile: services/billing-service/Dockerfile
    container_name: billing-service
    env_file: ../../services/billing-service/.env
    environment:
      - DOCKER_ENV=true
      - MEMBER_SERVICE_URL=http://member:3002
      - IDENTITY_SERVICE_URL=http://identity:3001
      - SCHEDULE_SERVICE_URL=http://schedule:3003
    ports: ["3004:3004"]
    volumes:
      - ../../packages:/packages:ro
    restart: unless-stopped
