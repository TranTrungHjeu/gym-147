# ================================
# GitLab CI/CD Pipeline
# GYM-147 Full Stack Application
# ================================

image: alpine:latest

stages:
  - lint-test
  - deploy

# ==================== JOB 1: LINT & TEST ====================
lint-and-test:
  stage: lint-test
  image: node:20-alpine
  before_script:
    - apk add --no-cache git curl
  script:
    - npm install --no-audit --prefer-offline || true
    - npm run lint || echo "No lint script"
    - npm test --if-present || echo "No tests"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
    policy: push
  only:
    - main
    - develop

# ==================== JOB 2: DEPLOY TO VPS ====================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client ca-certificates docker-cli curl
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'ENDSSH'
        set -e
        VPS_DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/gym147}"
        echo ">>> Deploy path: $VPS_DEPLOY_PATH"
        cd "$VPS_DEPLOY_PATH"

        # Ensure remote 'origin' points at GitLab for this pipeline.
        # (Working repo on this VPS was cloned from GitHub earlier.)
        # CI_PROJECT_PATH is not always available inside the remote shell,
        # so use the explicit GitLab URL instead.
        sudo -n chown -R "$(whoami)" .git 2>/dev/null || chown -R "$(whoami)" .git 2>/dev/null || true
        git remote remove origin 2>/dev/null || true
        git remote add origin https://gitlab.com/TranTrungHiu/gym-147.git
        git fetch origin main
        git reset --hard origin/main

        # Stop old containers (do not remove volumes/networks)
        docker-compose -f docker-compose.vps-build.yml down --remove-orphans

        # Rebuild & start services locally on VPS (no external registry)
        docker-compose -f docker-compose.vps-build.yml build --no-cache
        docker-compose -f docker-compose.vps-build.yml up -d

        # Show logs
        docker-compose -f docker-compose.vps-build.yml logs --tail=30

        # Cleanup dangling images
        docker image prune -f
      ENDSSH
  environment:
    name: production
    url: https://gym-147.example.com
  only:
    - main
  when: manual
