# ================================
# GitLab CI/CD Pipeline
# GYM-147 Full Stack Application
# ================================

image: docker:24.0.5

services:
  - docker:24.0.5-dind

stages:
  - lint-test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_REGISTRY: "registry.hub.docker.com"

before_script:
  - docker info

# ==================== JOB 1: LINT & TEST ====================
lint-and-test:
  stage: lint-test
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - npm install -g npm
  script:
    - npm ci
    - npm run lint || echo "No lint script found"
    - npm test --if-present || echo "No tests found"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
  only:
    - main
    - develop
    - merge_requests

# ==================== JOB 2: BUILD BACKEND ====================
build-backend:
  stage: build
  image: docker:24.0.5
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - |
      for SERVICE in identity-service member-service schedule-service billing-service; do
        echo "Building $SERVICE..."
        docker build
          --pull
          --cache-from gym147/$SERVICE:latest
          -t gym147/$SERVICE:$CI_COMMIT_SHA
          -t gym147/$SERVICE:latest
          -f services/$SERVICE/Dockerfile
          .
        docker push gym147/$SERVICE:$CI_COMMIT_SHA
        docker push gym147/$SERVICE:latest
      done
  artifacts:
    paths:
      - services/*/dist/
  only:
    - main
    - develop

# ==================== JOB 3: BUILD WEB ADMIN ====================
build-web-admin:
  stage: build
  image: docker:24.0.5
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - echo "Building web-admin..."
    - docker build
        --pull
        --cache-from gym147/web-admin:latest
        -t gym147/web-admin:$CI_COMMIT_SHA
        -t gym147/web-admin:latest
        -f apps/web-admin/Dockerfile
        .
    - docker push gym147/web-admin:$CI_COMMIT_SHA
    - docker push gym147/web-admin:latest
  only:
    - main
    - develop

# ==================== JOB 4: BUILD GATEWAY ====================
build-gateway:
  stage: build
  image: docker:24.0.5
  before_script:
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - echo "Building gateway..."
    - docker build
        --pull
        --cache-from gym147/gateway:latest
        -t gym147/gateway:$CI_COMMIT_SHA
        -t gym147/gateway:latest
        -f infrastructure/gateway/Dockerfile
        .
    - docker push gym147/gateway:$CI_COMMIT_SHA
    - docker push gym147/gateway:latest
  only:
    - main
    - develop

# ==================== JOB 5: DEPLOY TO VPS ====================
deploy-vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client ca-certificates docker-cli
    - eval $(ssh-agent -s)
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
  script:
    - echo "Deploying to VPS..."
    - ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST "
        docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD &&
        cd $VPS_DEPLOY_PATH &&
        docker compose -f docker-compose.production.yml pull &&
        docker compose -f docker-compose.production.yml down &&
        docker compose -f docker-compose.production.yml up -d &&
        docker compose -f docker-compose.production.yml logs --tail=50 &&
        docker image prune -f
      "
  environment:
    name: production
    url: https://gym-147.example.com
  only:
    - main
  when: manual
