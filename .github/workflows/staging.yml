# ================================
# Staging Environment Workflow
# Auto-deploy on develop branch push
# ================================

name: Staging Deploy

on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          port: ${{ secrets.STAGING_VPS_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            
            # Pull latest code
            git pull origin develop
            
            # Pull latest images
            docker compose -f docker-compose.staging.yml pull
            
            # Deploy
            docker compose -f docker-compose.staging.yml up -d --build
            
            # Run migrations
            docker compose -f docker-compose.staging.yml exec identity-service npx prisma migrate deploy
            docker compose -f docker-compose.staging.yml exec member-service npx prisma migrate deploy
            docker compose -f docker-compose.staging.yml exec schedule-service npx prisma migrate deploy
            docker compose -f docker-compose.staging.yml exec billing-service npx prisma migrate deploy
            
            echo "✅ Staging deployed successfully"
