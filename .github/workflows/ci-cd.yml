# ================================
# GitHub Actions CI/CD Pipeline
# GYM-147 Full Stack Application
# ================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==================== JOB 1: LINT & TEST ====================
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Lint checks
      - name: Run ESLint
        run: npm run lint || echo "No lint script found"

      # Run unit tests
      - name: Run Tests
        run: npm test --if-present

  # ==================== JOB 2: BUILD DOCKER IMAGES ====================
  build-backend:
    name: Build Backend Services
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - identity-service
          - member-service
          - schedule-service
          - billing-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== JOB 3: BUILD WEB ADMIN ====================
  build-web-admin:
    name: Build Web Admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/web-admin
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web Admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web-admin/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== JOB 4: BUILD GATEWAY ====================
  build-gateway:
    name: Build API Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== JOB 5: DEPLOY TO VPS ====================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-backend, build-web-admin, build-gateway]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            # Pull latest docker-compose
            docker compose -f docker-compose.prod.yml pull
            
            # Pull latest images
            docker compose -f docker-compose.prod.yml pull
            
            # Stop and remove old containers
            docker compose -f docker-compose.prod.yml down
            
            # Start services
            docker compose -f docker-compose.prod.yml up -d
            
            # Show logs
            docker compose -f docker-compose.prod.yml logs --tail=50
            
            # Clean up unused images
            docker image prune -f

  # ==================== JOB 6: NOTIFY ====================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: always()
    
    steps:
      - name: Send Discord Notification
        if: vars.DISCORD_WEBHOOK != ''
        uses: appleboy/discord-action@v0.1.0
        with:
          webhook_id: ${{ vars.DISCORD_WEBHOOK_ID }}
          webhook_token: ${{ vars.DISCORD_WEBHOOK_TOKEN }}
          status: ${{ job.status }}
          message: |
            **GYM-147 Deployment ${{ job.status }}**
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            ${{ needs.deploy.outputs.deploy_url || 'Manual deployment required' }}
