# ================================
# Pull Request Checks
# Run on every PR
# ================================

name: PR Checks

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  # Security scan
  security-check:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Build verification
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --if-present

      - name: Build Web Admin
        run: |
          cd apps/web-admin
          npm run build

      - name: Build Services
        run: |
          for service in identity-service member-service schedule-service billing-service; do
            cd services/$service
            npm ci
            npx prisma generate
            cd ../..
          done

  # Comment PR with build status
  comment-status:
    name: Comment PR Status
    runs-on: ubuntu-latest
    needs: [security-check, build-check]
    permissions:
      pull-requests: write
    
    steps:
      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## PR Checks ✅
              
              | Check | Status |
              |-------|--------|
              | Security Audit | ${needs.security-check.result === 'success' ? '✅ Passed' : '❌ Failed'} |
              | Build Verification | ${needs.build-check.result === 'success' ? '✅ Passed' : '❌ Failed'} |
              
              **Branch:** \`${{ github.head_ref }}\`
              **Commit:** \`${{ github.sha }}\``
            })
