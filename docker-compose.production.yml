# ================================
# Production Docker Compose (GitLab Registry)
# GYM-147 Full Stack Deployment
# ================================

services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: gym147_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  redis:
    image: redis:7-alpine
    container_name: gym147_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym_network

  # ==================== BACKEND SERVICES ====================
  identity-service:
    image: registry.gitlab.com/trantrunghieu/gym-147/identity-service:latest
    container_name: gym147_identity
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${POSTGRES_URL:-postgresql://gym:secret@postgres:5432/gym_identity}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@gym147.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      S3_BUCKET: ${S3_BUCKET:-gym147-uploads}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FACE_API_MODEL_PATH: /app/models
    volumes:
      - face_models:/app/models
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gym_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  member-service:
    image: registry.gitlab.com/trantrunghieu/gym-147/member-service:latest
    container_name: gym147_member
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: ${POSTGRES_URL:-postgresql://gym:secret@postgres:5432/gym_member}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gym_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  schedule-service:
    image: registry.gitlab.com/trantrunghieu/gym-147/schedule-service:latest
    container_name: gym147_schedule
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: ${POSTGRES_URL:-postgresql://gym:secret@postgres:5432/gym_schedule}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gym_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  billing-service:
    image: registry.gitlab.com/trantrunghieu/gym-147/billing-service:latest
    container_name: gym147_billing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: ${POSTGRES_URL:-postgresql://gym:secret@postgres:5432/gym_billing}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gym_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-admin:
    image: registry.gitlab.com/trantrunghieu/gym-147/web-admin:latest
    container_name: gym147_web_admin
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.gym147.com}
      VITE_WS_URL: ${VITE_WS_URL:-wss://api.gym147.com}
    volumes:
      - web_admin_build:/dist
    ports:
      - "3000:80"
    depends_on:
      - gateway
    networks:
      - gym_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    image: registry.gitlab.com/trantrunghieu/gym-147/gateway:latest
    container_name: gym147_gateway
    restart: unless-stopped
    environment:
      PORT: ${GATEWAY_PORT:-80}
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${GATEWAY_SSL_PORT:-443}:443"
    depends_on:
      identity-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
    networks:
      - gym_network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: gym147_portainer
    restart: unless-stopped
    command: --http-enabled
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - gym_network

# ==================== VOLUMES ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  face_models:
    driver: local
  web_admin_build:
    driver: local
  portainer_data:
    driver: local

# ==================== NETWORKS ====================
networks:
  gym_network:
    driver: bridge
